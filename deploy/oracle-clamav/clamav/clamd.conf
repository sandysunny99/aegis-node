# clamd settings for the Aegis scan VM (clamav/clamav-debian:1.5.4).
# Based on the image defaults, plus limits that match Aegis' 50 MB upload cap.
LogFile /var/log/clamav/clamd.log
LogTime yes
LocalSocket /tmp/clamd.sock
TCPSocket 3310
User clamav

# Reload new signatures in place instead of loading a second copy beside the
# running one: lower peak memory on a small VM, at the cost of a short pause in
# scanning during each reload (clamav-rest then returns an error, which Aegis
# reports as CLAMAV_UNAVAILABLE).
ConcurrentDatabaseReload no

# Aegis rejects uploads above 50 MB; allow a little headroom for INSTREAM framing.
StreamMaxLength 60M
MaxFileSize 60M
MaxScanSize 200M
MaxThreads 4
