# Aegis Node — Render.com Blueprint
# Deploys the full stack as a single Docker web service.
# One container serves both the FastAPI backend AND the built React frontend.
#
# How to deploy:
#   1. Push this repo to GitHub (already done: github.com/sandysunny99/aegis-node)
#   2. Go to https://dashboard.render.com/select-repo
#   3. Connect the aegis-node repository
#   4. Render detects this render.yaml automatically
#   5. Set GEMINI_API_KEY (or GROQ_API_KEY) in the environment variables section
#   6. Click "Apply" — deployment takes ~5 minutes

services:
  - type: web
    name: aegis-node
    runtime: docker
    # Use the root Dockerfile (multi-stage: Node builds React, Python serves everything)
    dockerfilePath: ./Dockerfile
    # Build context is project root
    dockerContext: .
    plan: free          # Free tier: 512MB RAM, shared CPU, sleeps after 15min inactivity
    healthCheckPath: /health

    # Persistent storage for uploads and SQLite database (A-007)
    disk:
      name: aegis-data
      mountPath: /app/data
      sizeGB: 1

    envVars:
      # ── AI Provider ───────────────────────────────────────────────────────────
      # Set to: gemini | groq | xai | ollama | none
      # If none/key missing, app still works — AI panel shows setup instructions.
      - key: AI_PROVIDER
        value: gemini

      # Add your real key in the Render dashboard (Environment tab)
      - key: GEMINI_API_KEY
        sync: false       # sync: false = secret, set manually in dashboard

      - key: GROQ_API_KEY
        sync: false

      # xAI / Grok — secondary AI provider (auto-failover from Gemini)
      # Key format: xai-...
      # Dashboard: https://console.x.ai/
      - key: XAI_API_KEY
        sync: false       # Set manually in Render dashboard

      # ── ClamAV ────────────────────────────────────────────────────────────────
      - key: CLAMAV_HOST
        value: "localhost"

      - key: CLAMAV_PORT
        value: "3310"

      - key: CLAMAV_MOCK_MODE
        value: "${CLAMAV_MOCK_MODE:-false}"

      # ── Heuristic Scanning ────────────────────────────────────────────────────
      - key: ENABLE_HEURISTICS
        value: "true"

      # ── App Config ────────────────────────────────────────────────────────────
      - key: APP_ENV
        value: production

      - key: MAX_UPLOAD_SIZE_MB
        value: "100"      # Lower limit for free tier (512MB RAM)

      - key: DATABASE_URL
        value: sqlite:////app/data/aegis_node.db

      - key: ALLOWED_ORIGINS
        value: "*"

      - key: TRUSTED_PROXIES
        value: "10.0.0.0/8,127.0.0.1"

      # ── Auth & Token ──────────────────────────────────────────────────────────
      # Set API_KEY in Render dashboard to enable write-endpoint protection.
      # Leave empty (default) for open demo access.
      - key: API_KEY
        sync: false

      - key: DOWNLOAD_TOKEN_EXPIRY_MINUTES
        value: "60"

      # ── AI Fallback Chain ─────────────────────────────────────────────────────
      # Auto-failover: Gemini (primary) → xAI Grok (secondary)
      # If Gemini hits rate limit or errors, xAI is tried automatically.
      - key: AI_FALLBACK_CHAIN
        value: "xai"

      - key: FALLBACK_GEMINI_API_KEY
        sync: false

      - key: FALLBACK_GROQ_API_KEY
        sync: false

      - key: FALLBACK_XAI_API_KEY
        sync: false


