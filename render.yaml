# Aegis Node — Render.com Blueprint
# Deploys the full stack as a single Docker web service.
# One container serves both the FastAPI backend AND the built React frontend.
#
# How to deploy:
#   1. Push this repo to GitHub (already done: github.com/sandysunny99/aegis-node)
#   2. Go to https://dashboard.render.com/select-repo
#   3. Connect the aegis-node repository
#   4. Render detects this render.yaml automatically
#   5. Set GROQ_API_KEY in the environment variables section
#   6. Click "Apply" — deployment takes ~5 minutes

services:
  - type: web
    name: aegis-node
    runtime: docker
    # Use the root Dockerfile (multi-stage: Node builds React, Python serves everything)
    dockerfilePath: ./Dockerfile
    # Build context is project root
    dockerContext: .
    plan: free          # Free tier: 512MB RAM, shared CPU, sleeps after 15min inactivity
    healthCheckPath: /health

    # NOTE: Render free tier does NOT support persistent disks.
    # Uploads and SQLite data are stored in /tmp (ephemeral — cleared on redeploy/restart).
    # To keep data across restarts, upgrade to a paid plan and add a disk section.

    envVars:
      # ── AI Provider ───────────────────────────────────────────────────────────
      # Set to: groq | nvidia | cloudflare | huggingface | xai | ollama | none
      # If none/key missing, app still works — AI panel shows setup instructions.
      - key: AI_PROVIDER
        value: groq

      # Add your real key in the Render dashboard (Environment tab)
      - key: GEMINI_API_KEY
        sync: false       # sync: false = secret, set manually in dashboard

      - key: GROQ_API_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false

      - key: HF_TOKEN
        sync: false

      - key: FREELLMAPI_ENABLED
        value: "false"

      - key: FREELLMAPI_API_KEY
        sync: false

      - key: FREELLMAPI_BASE_URL
        value: "http://localhost:3001/v1"

      # xAI / Grok — secondary AI provider (auto-failover from Gemini)
      # Key format: xai-...
      # Dashboard: https://console.x.ai/
      - key: XAI_API_KEY
        sync: false       # Set manually in Render dashboard

      # ── Deployment profile ────────────────────────────────────────────────────
      # Render free tier = lite (512 MB, no persistent disk); reported by /health/detectors.
      - key: AEGIS_PROFILE
        value: lite

      # ── AV Provider ───────────────────────────────────────────────────────────
      # MetaDefender (hash lookup only) stays until the Oracle ClamAV gateway is live and
      # verified through Aegis. Then: AV_PROVIDER=clamav_rest, CLAMAV_API_URL=https://<domain>,
      # CLAMAV_API_TOKEN (secret, sync: false). See docs/RENDER_ORACLE_INTEGRATION.md.
      - key: AV_PROVIDER
        value: metadefender
      - key: METADEFENDER_BASE_URL
        value: "https://api.metadefender.com/v4"
      - key: METADEFENDER_API_KEY
        sync: false
      - key: CLAMAV_MOCK_MODE
        value: "false"
      # Oracle ClamAV gateway (deploy/oracle-clamav/setup-vm.sh). Set both in the dashboard.
      - key: CLAMAV_API_URL
        sync: false
      - key: CLAMAV_API_TOKEN
        sync: false
      # Answers only when AV_PROVIDER gives no result (e.g. the VM is down or reclaimed).
      - key: AV_FALLBACK_PROVIDER
        value: metadefender

      # ── Heuristic Scanning ────────────────────────────────────────────────────
      - key: ENABLE_HEURISTICS
        value: "true"

      # Rows inspected per dataset (larger files are scanned up to this and marked PARTIAL).
      - key: SCAN_MAX_ROWS
        value: "100000"

      # ── Threat intelligence (owner decision 27 Oct 2026: on) ──────────────────
      # Extra evidence only; never changes the local verdict. CIRCL hashlookup needs no key
      # and receives the file SHA-256 only. The others run only once their key is set in
      # the dashboard: MalwareBazaar/ThreatFox (SHA-256, URLs) use ABUSECH_AUTH_KEY,
      # VirusTotal (SHA-256) VIRUSTOTAL_API_KEY, URLhaus (URLs) URLHAUS_AUTH_KEY,
      # AbuseIPDB (public IPs) ABUSEIPDB_API_KEY.
      - key: ENABLE_CIRCL_HASHLOOKUP
        value: "true"
      - key: ENABLE_MALWAREBAZAAR
        value: "true"
      - key: ENABLE_THREATFOX
        value: "true"
      - key: ENABLE_VIRUSTOTAL
        value: "true"
      - key: ENABLE_URLHAUS
        value: "true"
      - key: ENABLE_ABUSEIPDB
        value: "true"
      - key: ABUSECH_AUTH_KEY
        sync: false
      - key: VIRUSTOTAL_API_KEY
        sync: false
      - key: URLHAUS_AUTH_KEY
        sync: false
      - key: ABUSEIPDB_API_KEY
        sync: false

      # ── App Config ────────────────────────────────────────────────────────────
      - key: APP_ENV
        value: production

      # Measured in a 512 MB container: peak 372 MiB for a 37 MB JSONL file; 25 MB keeps
      # every measured format under ~330 MiB (docs/RENDER_ORACLE_INTEGRATION.md §3).
      - key: MAX_UPLOAD_SIZE_MB
        value: "25"

      # Ephemeral SQLite path — data resets on restart (free tier limitation)
      - key: DATABASE_URL
        value: sqlite:////tmp/aegis_node.db
      - key: DATA_DIR
        value: /tmp/aegis_data

      - key: ALLOWED_ORIGINS
        value: '["https://aegis-node.onrender.com"]'

      - key: TRUSTED_PROXIES
        value: '["10.0.0.0/8", "127.0.0.1"]'

      # ── Auth & Token ──────────────────────────────────────────────────────────
      # Set API_KEY in Render dashboard to enable write-endpoint protection.
      # Leave empty (default) for open demo access.
      - key: API_KEY
        sync: false

      # Owner decision (19 Oct 2026): public demo without bot protection. Switches Turnstile off
      # even if its keys are still set; uploads stay rate-limited (10/minute per IP).
      - key: ALLOW_PUBLIC_UPLOADS
        value: "true"

      - key: DOWNLOAD_TOKEN_EXPIRY_MINUTES
        value: "60"

      # ── AI Fallback Chain ─────────────────────────────────────────────────────
      # Auto-failover: Groq (primary) -> NVIDIA -> Cloudflare -> Hugging Face -> FreeLLMAPI
      - key: AI_FALLBACK_CHAIN
        value: "nvidia,cloudflare,huggingface,freellmapi"

      - key: AI_OPTIONAL_PROVIDERS
        value: ""

      # ── Cloudflare Workers AI & Turnstile ─────────────────────────────────────
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false

      - key: CLOUDFLARE_API_TOKEN
        sync: false

      - key: CLOUDFLARE_TURNSTILE_SITE_KEY
        sync: false

      - key: CLOUDFLARE_TURNSTILE_SECRET_KEY
        sync: false

      - key: FALLBACK_CLOUDFLARE_API_TOKEN
        sync: false


  # Remove private services entirely for Render deployment. 
  # Render environment will use the external MetaDefender Cloud provider.
