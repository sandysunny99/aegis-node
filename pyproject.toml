[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["backend/.venv", "frontend/node_modules"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Tests, benchmarks and scripts put backend/ on sys.path before importing app modules.
"tests/**" = ["E402"]
"scripts/**" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
asyncio_mode = "auto"
filterwarnings = [
    # Starlette's TestClient warns about its httpx transport; tracked in docs/AUDIT_2026-10.md (R9).
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]
