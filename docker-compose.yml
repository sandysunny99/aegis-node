services:
  # ─── ClamAV Antivirus Daemon ──────────────────────────────────────────────
  clamav:
    image: clamav/clamav:stable
    container_name: aegis-clamav
    ports:
      - "3310:3310"
    volumes:
      - clamav_data:/var/lib/clamav
    environment:
      - CLAMAV_NO_MILTERD=true
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 120s  # ClamAV takes time for initial DB download (~250MB)
    restart: unless-stopped

  # ─── Aegis Node (Backend + Frontend in one container) ─────────────────────
  # Uses the root Dockerfile which builds React and bundles it with FastAPI.
  # Access the app at: http://localhost:8000
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aegis-node
    ports:
      - "8000:8000"
    environment:
      # ClamAV — uses service name as hostname inside Docker network
      - CLAMAV_HOST=clamav
      - CLAMAV_PORT=3310
      - CLAMAV_MOCK_MODE=${CLAMAV_MOCK_MODE:-false}
      # AI Provider — set to "gemini", "groq", "xai", "ollama", or "none"
      - AI_PROVIDER=${AI_PROVIDER:-gemini}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.0-flash}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.1-8b-instant}
      - XAI_API_KEY=${XAI_API_KEY:-}
      - XAI_MODEL=${XAI_MODEL:-grok-3-mini}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      # AI Fallback
      - AI_FALLBACK_CHAIN=${AI_FALLBACK_CHAIN:-xai}
      - FALLBACK_GEMINI_API_KEY=${FALLBACK_GEMINI_API_KEY:-}
      - FALLBACK_GROQ_API_KEY=${FALLBACK_GROQ_API_KEY:-}
      - FALLBACK_XAI_API_KEY=${FALLBACK_XAI_API_KEY:-}
      # Scanner & Heuristics
      - ENABLE_HEURISTICS=${ENABLE_HEURISTICS:-true}
      # Auth & Token
      - API_KEY=${API_KEY:-}
      - DOWNLOAD_TOKEN_EXPIRY_MINUTES=${DOWNLOAD_TOKEN_EXPIRY_MINUTES:-60}
      # App
      - APP_ENV=production
      - MAX_UPLOAD_SIZE_MB=500
      - DATABASE_URL=sqlite:////app/data/aegis_node.db
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
    volumes:
      # Persist uploads and DB across container restarts
      - ./data:/app/data
    depends_on:
      clamav:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  clamav_data:
    name: aegis_clamav_data
  aegis_db:
    name: aegis_node_db
