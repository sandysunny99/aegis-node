services:
  # ─── ClamAV Antivirus Daemon ───────────────────────────────────────────────
  clamav-daemon:
    image: clamav/clamav:stable
    container_name: aegis-clamav-daemon
    volumes:
      - clamav_data:/var/lib/clamav
    environment:
      - CLAMAV_NO_MILTERD=true
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 120s  # ClamAV takes time for initial DB download (~250MB)
    restart: unless-stopped

  # ─── ClamAV REST API Wrapper ───────────────────────────────────────────────
  clamav-rest:
    image: benzino77/clamav-rest-api:latest
    container_name: aegis-clamav-rest
    environment:
      - NODE_ENV=production
      - CLAMD_IP=clamav-daemon
      - CLAMD_PORT=3310
      - APP_PORT=3000
      - APP_FORM_KEY=FILES
      - APP_MAX_FILE_SIZE=52428800
    depends_on:
      clamav-daemon:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/v1/version', (res) => res.statusCode === 200 ? process.exit(0) : process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ─── Aegis Node (Backend + Frontend in one container) ──────────────────────────
  # Uses the root Dockerfile which builds React and bundles it with FastAPI.
  # Access the app at: http://localhost:8000
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aegis-node
    ports:
      - "8000:8000"
    environment:
      # ClamAV — connect via the REST wrapper
      - AV_PROVIDER=clamav_rest
      - CLAMAV_API_URL=http://clamav-rest:3000
      - CLAMAV_MOCK_MODE=false
      # AI Provider
      - AI_PROVIDER=${AI_PROVIDER:-groq}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.0-flash}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-openai/gpt-oss-20b}
      - XAI_API_KEY=${XAI_API_KEY:-}
      - XAI_MODEL=${XAI_MODEL:-grok-3-mini}
        - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
        - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN:-}
        - CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID:-}
        - HF_TOKEN=${HF_TOKEN:-}
        - FREELLMAPI_API_KEY=${FREELLMAPI_API_KEY:-}
        - FREELLMAPI_ENABLED=${FREELLMAPI_ENABLED:-true}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      # AI Fallback
      - AI_FALLBACK_CHAIN=${AI_FALLBACK_CHAIN:-nvidia,cloudflare,huggingface,freellmapi}
      - FALLBACK_CLOUDFLARE_API_TOKEN=${FALLBACK_CLOUDFLARE_API_TOKEN:-}
      - FALLBACK_GEMINI_API_KEY=${FALLBACK_GEMINI_API_KEY:-}
      - FALLBACK_GROQ_API_KEY=${FALLBACK_GROQ_API_KEY:-}
      - FALLBACK_XAI_API_KEY=${FALLBACK_XAI_API_KEY:-}
      # Scanner & Heuristics
      - ENABLE_HEURISTICS=${ENABLE_HEURISTICS:-true}
      # Auth & Token
      - API_KEY=${API_KEY:-}
      - DOWNLOAD_TOKEN_EXPIRY_MINUTES=${DOWNLOAD_TOKEN_EXPIRY_MINUTES:-60}
      # App
      - APP_ENV=development
      - MAX_UPLOAD_SIZE_MB=50
      - DATABASE_URL=sqlite:////app/data/aegis_node.db
      - ALLOWED_ORIGINS=["http://localhost:5173","http://localhost:8000"]
    volumes:
      # Persist uploads and DB across container restarts
      - ./data:/app/data
    depends_on:
      clamav-rest:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  clamav_data:
    name: aegis_clamav_data
  aegis_db:
    name: aegis_node_db



